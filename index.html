<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대진 바이브코딩 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 학년 구획 → 학생 카드(학번 라벨 + 3개 주제 트랙), PCB 기판처럼 정돈된 격자 */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --ink:#17201e; --muted:#5b6865; --line:#d9e0dd;
  --accent:#0d6b62; --accent-soft:#e1efec; --copper:#a85a22; --copper-soft:#f6e9de;
  --empty:#9aa6a3;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201f; --ink:#e4ebe9; --muted:#9aa8a5; --line:#2a3533;
  --accent:#4fbfb2; --accent-soft:#16312e; --copper:#e09a62; --copper-soft:#33241a; --empty:#5f6c69; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201f; --ink:#e4ebe9; --muted:#9aa8a5; --line:#2a3533;
  --accent:#4fbfb2; --accent-soft:#16312e; --copper:#e09a62; --copper-soft:#33241a; --empty:#5f6c69; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
a{color:inherit}
header.top{padding-block:40px 24px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.legend span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.legend b{font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button{font:inherit;font-size:14px;cursor:pointer;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.bar button:focus-visible,.bar input:focus-visible,a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.bar input{font:inherit;font-size:14px;margin-left:auto;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:200px;max-width:100%}
section.grade{margin-top:36px}
.grade-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.grade-head h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0}
.grade-head small{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.cards{display:grid;gap:16px}
article.stu{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px}
.stu-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.sid{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.04em;padding:3px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.stu-head h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.cls{color:var(--muted);font-size:13px}
.meter{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent)}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.tracks{grid-template-columns:1fr}}
.track{min-width:0;display:grid;align-content:start;gap:8px;padding-top:10px;border-top:2px solid var(--line)}
.track[data-k="game"]{border-top-color:var(--copper)}
.track[data-k="data"]{border-top-color:var(--accent)}
.track[data-k="proj"]{border-top-color:var(--ink)}
.track h4{margin:0;font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;color:var(--muted);font-weight:500}
.item{display:grid;gap:2px;min-width:0}
.item+.item{margin-top:6px}
.shot{display:block;margin:4px 0 6px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);aspect-ratio:16/10;max-width:100%}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .25s ease}
.shot:hover img{transform:scale(1.03)}
@media (prefers-reduced-motion:reduce){.shot img{transition:none}}
footer a{color:var(--accent)}
.lab{font-size:12px;font-weight:600;color:var(--muted)}
.item a.ttl{font-weight:600;text-decoration:none;color:var(--ink);overflow-wrap:anywhere;line-height:1.4}
.item a.ttl:hover{color:var(--accent);text-decoration:underline}
.item a.ttl::after{content:" ↗";color:var(--accent);font-weight:400}
.desc{font-size:13px;color:var(--muted);line-height:1.5}
.feat{margin:4px 0 0;padding:8px 10px 8px 22px;background:var(--copper-soft);border-radius:6px;font-size:13px;line-height:1.5}
.feat li+li{margin-top:2px}
.sub{font-size:12px}
.sub a{color:var(--copper);text-decoration:none;font-weight:600}
.sub a:hover{text-decoration:underline}
.none{font-size:13px;color:var(--empty)}
.note{font-size:12px;color:var(--copper)}
footer{margin-top:48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
.hide{display:none!important}
</style>
</head>

    <span><b>공공데이터 프로젝트</b> · PRD · 프로젝트</span>

</header>

</nav>

<main id="root"></main>

 {k:"proj",t:"공공데이터 프로젝트",slots:[["prd","프로젝트 PRD"],["proj","프로젝트"]]}
];
const IMG=new Set("10403_cvs 10403_jewel 10403_task 10409_box 10409_cvs 10409_proj 10409_time 10413_box 10413_cvs 10413_prd 10413_time 10511_box 10511_cvs 10511_jewel 10511_time 10517_cvs 10517_jewel 10517_proj 10517_task 20408_box 20408_cvs 20408_jewel 20408_prd 20408_proj 20408_shop 20408_task 20412_cvs 20412_jewel 20412_proj 20412_shop 20412_task 20414_jewel 20414_proj 20415_box 20415_cvs 20415_jewel 20415_prd 20415_proj 20415_task 20415_time 20416_box 20416_cvs 20416_jewel 20416_proj 20416_task 20416_time 20508_box 20508_cvs 20508_jewel 20508_prd 30514_box 30514_cvs 30514_jewel 30514_proj 30514_shop 30514_task 30514_time".split(" "));
const ALL=TRACKS.flatMap(t=>t.slots.map(s=>s[0]));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function itemHTML(s,key,label){
  let v=s[key];
  if(key==="jewel"&&!v&&s.studio) v=[s.studio[0],"AI Studio 버전","Vercel 배포 링크 없음"];
  if(!v) return `<div class="item"><span class="lab">${label}</span><span class="none">미등록</span></div>`;
  const ik=s.id+"_"+key;
  let h=`<div class="item"><span class="lab">${label}</span>`;
  if(IMG.has(ik)) h+=`<a class="shot" href="${esc(v[0])}" target="_blank" rel="noopener" tabindex="-1"><img src="shots/${ik}.jpg" alt="${esc(s.name)} ${esc(label)} 결과 화면" loading="lazy" width="640" height="400"></a>`;
  h+=`<a class="ttl" href="${esc(v[0])}" target="_blank" rel="noopener">${esc(v[1])}</a>`;
  if(v[2]) h+=`<span class="desc">${esc(v[2])}</span>`;
  if(v[3]) h+=`<span class="note">${esc(v[3])}</span>`;
  if(key==="jewel"&&s.studio){
    const [u,f]=s.studio;
    if(f.length) h+=`<ul class="feat">${f.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
    if(s.jewel) h+=`<span class="sub"><a href="${esc(u)}" target="_blank" rel="noopener">AI Studio 원본 ↗</a> <span class="desc">(Google 로그인 필요)</span></span>`;
  }
  return h+`</div>`;
}
function card(s){
  const done=ALL.filter(k=>s[k]||(k==="jewel"&&s.studio)).length;
  const g=s.id[0], cls=+s.id.slice(1,3), no=+s.id.slice(3);
  const hay=[s.id,s.name,...ALL.map(k=>s[k]?s[k][1]+" "+s[k][2]:"")].join(" ").toLowerCase();
  return `<article class="stu" data-hay="${esc(hay)}">
   <div class="stu-head"><span class="sid">${s.id}</span><h3>${esc(s.name)}</h3><span class="cls">${g}학년 ${cls}반 ${no}번</span>
    <span class="meter" title="등록한 과제 수"><span class="pips">${ALL.map(k=>`<i class="${(s[k]||(k==="jewel"&&s.studio))?"on":""}"></i>`).join("")}</span>${done}/${ALL.length}</span></div>
   <div class="tracks">${TRACKS.map(t=>`<div class="track" data-k="${t.k}"><h4>${t.t}</h4>${t.slots.map(([k,l])=>itemHTML(s,k,l)).join("")}</div>`).join("")}</div>
  </article>`;
}
const root=document.getElementById("root");
root.innerHTML=["3","2","1"].map(g=>{
  const list=S.filter(s=>s.id[0]===g).sort((a,b)=>a.id.localeCompare(b.id));
  return `<section class="grade" data-g="${g}" id="grade${g}"><div class="grade-head"><h2>${g}학년</h2><small>${list.length}명</small></div><div class="cards">${list.map(card).join("")}</div></section>`;
}).join("");

let grade="all";
const q=document.getElementById("q");
function apply(){
  const term=q.value.trim().toLowerCase();
  document.querySelectorAll("section.grade").forEach(sec=>{
    let vis=0;
    sec.querySelectorAll("article.stu").forEach(a=>{const ok=!term||a.dataset.hay.includes(term);a.classList.toggle("hide",!ok);if(ok)vis++;});
    sec.classList.toggle("hide",(grade!=="all"&&sec.dataset.g!==grade)||vis===0);
  });
}
document.querySelectorAll(".bar button").forEach(b=>b.addEventListener("click",()=>{
  grade=b.dataset.g;
  document.querySelectorAll(".bar button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  apply();
}));
q.addEventListener("input",apply);
